name: QA Automation Pipeline

# Se ejecuta cuando haces un push o un Pull Request a la rama 'main'
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest # Usa un servidor Linux de GitHub
    
    steps:
      # 1. Descarga tu código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instala Node.js (ajusta la versión a la que uses, ej: 18 o 20)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instala las dependencias de tu proyecto
      - name: Install dependencies
        run: npm ci

      # 4. Instala los navegadores de Playwright con sus dependencias de sistema
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 5. Ejecuta tus tests (asegúrate de que en tu package.json tengas un script "test")
      - name: Run QA Tests
        run: npm test
        
      # 6. (Opcional pero muy pro) Sube el reporte de HTML si los tests fallan o pasan
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
