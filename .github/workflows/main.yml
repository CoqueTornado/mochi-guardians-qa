
name: QA Automation Pipeline

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL directa de la demo HTML5"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      BASE_URL: ${{ inputs.base_url }}
      QA_OUTPUT: artifacts/latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run QA tests
        run: npm test

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mochi-qa-evidence
          path: artifacts/latest/
          if-no-files-found: warn
          retention-days: 30
